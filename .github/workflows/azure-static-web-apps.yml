name: Deploy to Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true

      - name: Show Deployment Context
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'
      
      - name: Check Token Format
        run: |
          echo "Token length: ${#AZURE_TOKEN}"
          echo "First 10 chars: ${AZURE_TOKEN:0:10}..."
          
          # Check connection string is set in environment
          if [[ -n "$MONGO_CONNECTION" ]]; then
            echo "MongoDB connection string is set"
            # Safe output of masked connection string
            CONNECTION_LENGTH=${#MONGO_CONNECTION}
            MASKED_URI=$(echo $MONGO_CONNECTION | sed -E 's/(mongodb\+srv:\/\/[^:]+:)([^@]+)(@.+)/\1****\3/')
            echo "Connection string (masked): $MASKED_URI"
            echo "Connection string length: $CONNECTION_LENGTH"
          else
            echo "WARNING: MongoDB connection string not found!"
          fi
        env:
          AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          MONGO_CONNECTION: ${{ secrets.MONGODB_CONNECTION_STRING }}      

      - name: Publish Blazor App
        run: dotnet publish ./RuffinWeatherStation/RuffinWeatherStation.csproj -c Release -o ./RuffinWeatherStation/publish-static

      - name: Verify Published Artifact
        run: |
          ls -la ./RuffinWeatherStation/publish-static/wwwroot | head -n 50
          test -f ./RuffinWeatherStation/publish-static/wwwroot/index.html
      
      - name: Deploy to Static Web App
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_GRASS_0FFC76B10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          app_location: "./RuffinWeatherStation/publish-static/wwwroot"
          skip_app_build: true
          action: "upload"
      
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"