<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RuffinWeatherStation</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/weather-dashboard.css" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/png" href="favicon.png" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link href="RuffinWeatherStation.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="_content/Radzen.Blazor/css/default-base.css">
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        (function () {
            var canonicalHost = "ruffinweather.today";
            var host = window.location.hostname.toLowerCase();

            var shouldRedirect = host === "ruffinweather.com"
                || host === "www.ruffinweather.com"
                || host === "www.ruffinweather.today"
                || host.endsWith(".azurestaticapps.net");

            if (!shouldRedirect) {
                return;
            }

            var targetUrl = "https://" + canonicalHost + window.location.pathname + window.location.search + window.location.hash;

            if (window.location.href !== targetUrl) {
                window.location.replace(targetUrl);
            }
        })();
    </script>
    <script>
        window.ruffinWeatherStorage = window.ruffinWeatherStorage || {};

        window.ruffinWeatherStorage.cleanupRecentMeasurementsCache = function (maxPersistCount, maxJsonLength) {
            var removed = 0;
            var prefix = "recent_measurements_";

            try {
                for (var i = localStorage.length - 1; i >= 0; i--) {
                    var key = localStorage.key(i);
                    if (!key || key.indexOf(prefix) !== 0) {
                        continue;
                    }

                    var isOversizedCount = false;
                    var countPart = key.substring(prefix.length).split("_")[0];
                    var parsedCount = Number.parseInt(countPart, 10);
                    if (!Number.isNaN(parsedCount) && parsedCount > maxPersistCount) {
                        isOversizedCount = true;
                    }

                    var isOversizedPayload = false;
                    if (!isOversizedCount) {
                        var value = localStorage.getItem(key);
                        isOversizedPayload = !!value && value.length > maxJsonLength;
                    }

                    if (isOversizedCount || isOversizedPayload) {
                        localStorage.removeItem(key);
                        removed++;
                    }
                }
            } catch (e) {
                console.warn("recent measurement cache cleanup failed", e);
            }

            return removed;
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.js"></script>
</body>

</html>
